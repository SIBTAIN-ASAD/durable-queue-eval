x-verifier: &verifier
  build: ./durable-queue/tests
  network_mode: none
  cpus: 2
  mem_limit: 2g
  # The verifier runs candidate code as uid 1000, away from tests and rewards.
  entrypoint: ["/bin/bash", "-c"]
  command:
    - 'bash /tests/test.sh && cat /logs/verifier/summary.json && echo && echo "Score: $$(cat /logs/verifier/reward.txt)" && test "$$(cat /logs/verifier/reward.txt)" = "$$EXPECTED_SCORE"'

services:
  oracle:
    <<: *verifier
    environment:
      EXPECTED_SCORE: "1"
    volumes:
      - ./durable-queue/solution/queue.py:/app/queue.py:ro
      - ./results/oracle:/logs/verifier

  nop:
    <<: *verifier
    environment:
      EXPECTED_SCORE: "0"
    volumes:
      - ./durable-queue/environment/workspace/queue.py:/app/queue.py:ro
      - ./results/nop:/logs/verifier
